name: file-size

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifica limite de 400 linhas por arquivo
        run: python scripts/check_file_size.py

      - name: Testes do verificador
        run: python -m unittest discover -s scripts/tests -v
