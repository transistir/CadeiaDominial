name: Deploy produção (por tag)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy no servidor principal
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Build e deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 46.62.152.252
          username: root
          port: 22
          key: ${{ secrets.DEPLOY_KEY_PROD }}
          fingerprint: ${{ secrets.PROD_HOST_FINGERPRINT }}
          timeout: 60s
          command_timeout: 55m

          script: |
            bash -se <<'DEPLOY_SCRIPT'
            set -Eeuo pipefail

            trap 'rc=$?; echo "ERRO: deploy falhou na linha ${LINENO}: ${BASH_COMMAND} (exit ${rc})" >&2; exit "${rc}"' ERR

            APP_DIR="/root/CadeiaDominial"
            TAG_NAME="${GITHUB_REF_NAME}"

            echo "==> Validando ambiente"

            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "ERRO: docker-compose não está instalado ou não está no PATH." >&2
              exit 1
            fi

            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "ERRO: ${APP_DIR} não existe ou não é um repositório Git." >&2
              exit 1
            fi

            cd "${APP_DIR}"

            echo "==> Deploy da tag: ${TAG_NAME}"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERRO: existem alterações locais rastreadas no servidor." >&2
              git status --short
              exit 1
            fi

            # Busca todas as tags e a tag específica
            git fetch --prune origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

            # Checkout direto na tag (detached HEAD — seguro para produção)
            git checkout "tags/${TAG_NAME}"

            echo "==> Tag que será implantada"
            git log -1 --oneline --decorate

            echo "==> Fazendo backup do banco antes do deploy"
            BACKUP_DIR="${APP_DIR}/backups"
            mkdir -p "${BACKUP_DIR}"
            BACKUP_FILE="${BACKUP_DIR}/pre_deploy_${TAG_NAME}_$(date +%Y%m%d_%H%M%S).sql"
            docker-compose exec -T db pg_dump -U ${DB_USER:-cadeia_user} -d ${DB_NAME:-cadeia_dominial} > "${BACKUP_FILE}" || {
              echo "AVISO: backup automático falhou. Faça manualmente antes de prosseguir se necessário." >&2
            }

            echo "==> Executando build sem cache"
            if ! docker-compose build --no-cache web; then
              echo "ERRO: docker-compose build --no-cache web falhou." >&2
              exit 1
            fi

            echo "==> Subindo os containers"
            docker-compose up -d

            echo "==> Aguardando healthcheck do serviço web"
            HEALTHY=false
            for attempt in $(seq 1 60); do
              if docker-compose ps web | grep -qw healthy; then
                HEALTHY=true
                echo "Serviço web saudável."
                break
              fi
              echo "Healthcheck pendente: tentativa ${attempt}/60"
              sleep 5
            done

            if [ "${HEALTHY}" != "true" ]; then
              echo "ERRO: serviço web não ficou saudável em 5 minutos." >&2
              docker-compose ps
              docker-compose logs --tail=100 web || true
              exit 1
            fi

            echo "==> Executando migrations"
            docker-compose exec -T web python manage.py migrate --noinput || {
              echo "ERRO: migrate falhou. O container pode precisar de rollback." >&2
              exit 1
            }

            echo "==> Executando collectstatic"
            if ! docker-compose exec -T web python manage.py collectstatic --noinput; then
              echo "ERRO: collectstatic falhou." >&2
              exit 1
            fi

            echo "==> Estado final dos containers"
            docker-compose ps

            echo "=========================================="
            echo "  ✅ Deploy da tag ${TAG_NAME} concluído!"
            echo "=========================================="
            DEPLOY_SCRIPT
