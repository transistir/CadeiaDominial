<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editar SVG - Cadeia Dominial</title>

    <!-- O SVGEdit resolve CSS, ícones e extensões por caminhos relativos ao
         documento (./svgedit.css, ./images, ./extensions). O <base> aponta
         todos eles para o CDN, evitando 404 no servidor da aplicação. -->
    <!-- CSP restritivo: permite apenas o CDN do SVGEdit e estilos inline,
         mitigando risco de supply-chain do CDN (Bug 1). Auto-hospedar
         SVGEdit em PR futura removerá a dependência externa. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net;">

    <style id="styleoverrides" media="screen"></style>
    <link href="svgedit.css" rel="stylesheet" media="all">
</head>
<body style="margin:0">
    <!-- O container do SVGEdit precisa ter largura e altura definidas -->
    <div id="container" style="width:100%;height:100vh"></div>

    <script type="module">
        import Editor from './Editor.js'

        const svgEditor = new Editor(document.getElementById('container'))
        svgEditor.setConfig({
            // Isola o armazenamento local deste editor do SVGEdit padrão
            canvasName: 'cadeia-dominial',
            lang: 'pt-BR',
            extensions: [],
            noDefaultExtensions: false
        })
        svgEditor.init()

        // O organograma chega pelo navegador (mesma origem), não pelo servidor:
        // via `?source=` a URL estouraria o limite de tamanho em árvores
        // grandes e o SVG apareceria nos logs de acesso. A query string `?t=`
        // força o navegador a recarregar a aba (cache-buster), garantindo
        // que o editor sempre mostre a cadeia atual, nunca uma anterior.
        // O SVG viaja em window.name (limpa automaticamente quando a aba
        // fecha) em vez de localStorage (que persiste entre sessões e pode
        // ficar órfão se o popup for bloqueado).
        const svg = (() => {
            const wn = window.name
            const prefix = 'cadeiaDominialSvgEdit='
            if (wn && wn.startsWith(prefix)) {
                window.name = '' // limpa window.name após consumo
                return wn.slice(prefix.length)
            }
            // Fallback: localStorage (caso window.name falhe)
            const ls = localStorage.getItem('cadeiaDominialSvgEdit')
            if (ls) {
                localStorage.removeItem('cadeiaDominialSvgEdit')
                return ls
            }
            return null
        })()
        if (svg) svgEditor.loadFromString(svg)
    </script>
</body>
</html>
