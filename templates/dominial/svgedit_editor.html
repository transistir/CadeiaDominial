<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editar SVG - Cadeia Dominial</title>

    <!--
         O SVGEdit resolve CSS, ícones e extensões por caminhos relativos ao
         documento (./svgedit.css, ./images, ./extensions). O <base> aponta
         todos eles para o CDN, evitando 404 no servidor da aplicação.

         CSP: restringe carregamento a 'self' + jsDelivr. O 'unsafe-inline'
         em script-src é necessário porque o bootstrap é um <script> inline
         que importa Editor.js dinamicamente do CDN. Auto-hospedar o SVGEdit
         em PR futura permitirá CSP mais rígido (com nonce/hash).
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self';">
    <base href="https://cdn.jsdelivr.net/npm/svgedit@7.4.2/dist/editor/">

    <style id="styleoverrides" media="screen"></style>
    <link href="svgedit.css" rel="stylesheet" media="all">
</head>
<body style="margin:0">
    <!-- O container do SVGEdit precisa ter largura e altura definidas -->
    <div id="container" style="width:100%;height:100vh"></div>

    <script type="module">
        import Editor from './Editor.js'

        // Lê e consome a chave ANTES de qualquer await, para não competir
        // com o cleanup de fallback do produtor.
        const LS_KEY = 'cadeiaDominialSvgEdit'
        const svg = localStorage.getItem(LS_KEY)
        localStorage.removeItem(LS_KEY)

        // O ext-storage do SVGEdit persiste o canvas em svgedit-<canvasName> e o
        // restaura na init(), sobrescrevendo o organograma que injetamos. Aqui o
        // conteúdo vem SEMPRE da aba de origem, então o estado salvo nunca serve.
        localStorage.removeItem('svgedit-cadeia-dominial')

        const svgEditor = new Editor(document.getElementById('container'))
        svgEditor.setConfig({
            canvasName: 'cadeia-dominial',
            lang: 'pt-BR',
            noStorageOnLoad: true,
            storagePrompt: false,
            extensions: [],
            noDefaultExtensions: false
        })

        // init() é async — carregar antes dela resolver faz o restore vencer.
        await svgEditor.init()
        if (svg) svgEditor.loadFromString(svg)
    </script>
</body>
</html>
