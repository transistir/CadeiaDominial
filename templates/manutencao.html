{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>Sistema em Manutenção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #2c3e50; }
        .mensagem {
            font-size: 1.1rem; color: #7f8c8d; margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .fim-estimado {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .auto-refresh {
            margin-top: 2rem; font-size: 0.85rem; color: #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Sistema em Manutenção</h1>
        <p class="mensagem">{{ mensagem }}</p>
        {% if fim_estimado %}
        <p class="fim-estimado">⏰ Voltamos às {{ fim_estimado }}</p>
        {% endif %}
        <p class="auto-refresh">Esta página é atualizada automaticamente a cada 60 segundos.</p>
    </div>
</body>
</html>
